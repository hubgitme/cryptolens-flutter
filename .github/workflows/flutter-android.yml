name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Android platform
        run: |
          flutter create --platforms=android --project-name cryptolens_app --org com.hubgitme /tmp/scaffold
          cp -r /tmp/scaffold/android .
          sed -i 's/android:label="[^"]*"/android:label="کریپتو لنز"/' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml || \
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          if grep -q 'minSdk = flutter.minSdkVersion' android/app/build.gradle.kts; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          fi
          python3 - <<'PY'
          # flutter_local_notifications needs core library desugaring (java.time APIs)
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          if 'isCoreLibraryDesugaringEnabled' not in s:
              old = 'targetCompatibility = JavaVersion.VERSION_11'
              assert old in s, 'compileOptions pattern not found'
              s = s.replace(old, old + '\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'desugar_jdk_libs' not in s:
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")'
              if 'dependencies {' in s:
                  s = s.replace('dependencies {', 'dependencies {\n    ' + dep, 1)
              else:
                  s += '\ndependencies {\n    ' + dep + '\n}\n'
          open(p, 'w').write(s)
          print('desugaring enabled')
          PY

      - name: Get packages
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build release APK (arm64 only)
        run: |
          flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }} --build-name=1.1.${{ github.run_number }}
          base64 -d keystore/release.p12.b64 > /tmp/release.p12
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          ${BT}zipalign -f -p 4 build/app/outputs/flutter-apk/app-release.apk /tmp/aligned.apk
          ${BT}apksigner sign --ks /tmp/release.p12 --ks-type PKCS12 --ks-pass pass:cryptolens --key-pass pass:cryptolens --out cryptolens-arm64.apk /tmp/aligned.apk
          ${BT}apksigner verify --print-certs cryptolens-arm64.apk
          ls -lh cryptolens-arm64.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 cryptolens-arm64.apk --title "کریپتو لنز Flutter — نسخه ۱" --notes "نسخه نیتیو Flutter (مرحله ۱: چارت + اندیکاتورها + سایدبار)" || gh release upload v1.0.0 cryptolens-arm64.apk --clobber
