name: cryptolens_app
description: "کریپتو لنز — تحلیل تکنیکال ارز دیجیتال (نسخه نیتیو Flutter)"
publish_to: "none"
version: 1.1.0+7

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  flutter_local_notifications: ^19.0.0
  workmanager: ^0.9.0

# workmanager_android 0.9.0+3 تا 0.9.3 روی AGP 9 پلاگین Kotlin را رد می‌کنند
# و کلاس WorkmanagerPlugin ساخته نمی‌شود (خطای cannot find symbol در CI)؛
# پس نسخه 0.9.0+2 را پین می‌کنیم تا وقتی به workmanager 0.10.x رفتیم.
dependency_overrides:
  workmanager_android: 0.9.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
